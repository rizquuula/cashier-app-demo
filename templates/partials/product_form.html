<tr>
    <td colspan="4" class="py-2">
        <form hx-put="/products/{{ product.id }}" hx-target="body" class="flex flex-wrap gap-2 items-center">
            <input type="text" name="name" value="{{ product.name }}" required
                   class="px-3 py-2 border rounded text-sm flex-1 min-w-[100px]">
            <input type="number" step="0.01" name="price" value="{{ product.price }}" required
                   class="px-3 py-2 border rounded text-sm w-24">
            <input type="number" name="stock" value="{{ product.stock }}" required
                   class="px-3 py-2 border rounded text-sm w-24">
            <button type="submit"
                    class="px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">Save</button>
            <button type="button" hx-get="/products/" hx-target="closest div" hx-swap="outerHTML"
                    class="px-3 py-2 bg-gray-500 text-white rounded text-sm hover:bg-gray-600">Cancel</button>
        </form>
    </td>
</tr>
