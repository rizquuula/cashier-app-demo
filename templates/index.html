{% extends "base.html" %}
{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Product Management -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Product Management</h2>
        <div class="mb-4">
            <form hx-post="/products/" hx-target="body" class="flex flex-wrap gap-2">
                <input type="text" name="name" placeholder="Product name" required
                       class="px-3 py-2 border rounded-lg text-sm flex-1 min-w-[120px]">
                <input type="number" step="0.01" name="price" placeholder="Price" required
                       class="px-3 py-2 border rounded-lg text-sm w-24">
                <input type="number" name="stock" placeholder="Stock" required
                       class="px-3 py-2 border rounded-lg text-sm w-24">
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Add</button>
            </form>
        </div>
        <div hx-get="/products/" hx-trigger="load" hx-swap="innerHTML">
            <p class="text-gray-400 text-sm">Loading products...</p>
        </div>
    </div>

    <!-- Transaction Section -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">New Transaction</h2>
        <div hx-get="/transactions/" hx-trigger="load" hx-swap="innerHTML">
            <p class="text-gray-400 text-sm">Loading transaction panel...</p>
        </div>
    </div>

    <!-- Chart -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Sales Chart (7 Days)</h2>
        <div hx-get="/chart" hx-trigger="load" hx-swap="innerHTML">
            <p class="text-gray-400 text-sm">Loading chart...</p>
        </div>
    </div>

    <!-- Transaction Log -->
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-bold mb-4 text-gray-800">Transaction Log</h2>
        <div hx-get="/transactions/log" hx-trigger="load" hx-swap="innerHTML">
            <p class="text-gray-400 text-sm">Loading log...</p>
        </div>
    </div>
</div>
{% endblock %}
